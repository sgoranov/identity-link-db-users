# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

controllers:
    resource: routing.controllers

openapi_yaml:
    path: /api/v1/openapi.yaml
    methods: GET
    controller: sgoranov\IdentityLinkShared\Controller\OpenApiController::openapi

api_v1_ping:
    path: /api/v1/ping
    methods: GET
    controller: sgoranov\IdentityLinkShared\Controller\PingController::ping

api_v1_query:
    path: /api/v1/query
    methods: POST
    controller: sgoranov\IdentityLinkShared\Controller\QueryController::query

switch_locale:
    methods: GET
    path: /switch-locale/{locale}
    controller: sgoranov\IdentityLinkShared\Controller\LocaleController::switchLocale
