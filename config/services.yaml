# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    fallback_app_secret: '%env(APP_SECRET)%'
    fallback_db_user: '%env(DB_USER)%'
    fallback_db_password: '%env(DB_PASSWORD)%'
    feature_reset_password_enabled: '%env(bool:FEATURE_RESET_PASSWORD_ENABLED)%'
    mailer_from_address: '%env(string:MAILER_FROM_ADDRESS)%'
    mailer_from_name: '%env(string:MAILER_FROM_NAME)%'
    password_validation_enabled: '%env(bool:FEATURE_PASSWORD_VALIDATION_ENABLED)%'
    reset_password_redirect_url: '%env(string:RESET_PASSWORD_REDIRECT_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Makes sgoranov\IdentityLinkShared services available
    sgoranov\IdentityLinkShared\:
        resource: '../vendor/sgoranov/identity-link-shared/src/*'

    sgoranov\IdentityLinkShared\Security\AccessTokenHandlerConfiguration:
        arguments:
            $issuer: '%env(JWT_URL)%'
            $audiences: ['%env(JWT_URL)%']
            $jwksUri: '%env(JWT_JWKS_URI)%'

    sgoranov\IdentityLinkShared\Api\DTO\AbstractQueryRequest:
        alias: App\Api\DTO\Query\QueryRequest

    sgoranov\IdentityLinkShared\Api\DoctrineEntityType:
        alias: App\Enum\EntityType

    sgoranov\IdentityLinkShared\EventListener\XForwardedPrefixListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 10 }

    sgoranov\IdentityLinkShared\EventListener\LocaleListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 15 }

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    app.security.scope_voter:
        class: Symfony\Component\Security\Core\Authorization\Voter\RoleVoter
        arguments: ['users.']
        tags: ['security.voter']

    sgoranov\IdentityLinkShared\EventListener\RequestResponseLogger:
        arguments:
            $logger: '@monolog.logger.rest'
