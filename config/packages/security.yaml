security:
    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            pattern: ^/api
            stateless: true
            access_token:
                token_handler: sgoranov\IdentityLinkShared\Security\AccessTokenHandler


    # Note: Only the *first* matching rule is applied
    access_control:
         - { path: ^/api/v1/openapi.yaml, roles: PUBLIC_ACCESS }
         - { path: ^/api/v1/ping, roles: PUBLIC_ACCESS }
         - { path: ^/reset-password, roles: PUBLIC_ACCESS }
         - { path: ^/switch-locale, roles: PUBLIC_ACCESS }

         - { path: ^/api/v1/auth, roles: IS_AUTHENTICATED_FULLY }
         - { path: ^/api/v1/profile, roles: IS_AUTHENTICATED_FULLY }
         - { path: ^/api/v1/query, roles: users.query }
         - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
